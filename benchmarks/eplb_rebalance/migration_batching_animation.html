<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Migration Batching</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08111d;
      --panel: #101d2e;
      --panel-2: #15253b;
      --line: #2a3f5c;
      --text: #f2f7fc;
      --muted: #91a4bc;
      --cyan: #38d5ef;
      --green: #65e6a3;
      --amber: #ffbd66;
      --red: #ff7185;
      --violet: #aa8cff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(56, 213, 239, .10), transparent 28%),
        radial-gradient(circle at 90% 8%, rgba(170, 140, 255, .09), transparent 30%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    button { font: inherit; }
    .page { width: min(1120px, calc(100% - 28px)); margin: auto; padding: 28px 0; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 18px; }
    .eyebrow { margin: 0 0 7px; color: var(--cyan); font-size: 11px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 5vw, 54px); line-height: 1.04; letter-spacing: -.045em; }
    .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 14px; }
    .summary {
      flex: 0 0 auto;
      padding: 11px 14px;
      border: 1px solid rgba(101, 230, 163, .4);
      border-radius: 12px;
      color: #c9ffdf;
      background: rgba(101, 230, 163, .07);
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .stage {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(20, 37, 59, .96), rgba(10, 22, 37, .98));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .24);
    }

    .stage-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 72px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
    }
    .stage-head h2 { margin: 0 0 5px; font-size: 20px; }
    .stage-head p { margin: 0; color: var(--muted); font-size: 12px; }
    .rule {
      padding: 9px 12px;
      border: 1px solid rgba(56, 213, 239, .4);
      border-radius: 10px;
      color: var(--cyan);
      background: rgba(56, 213, 239, .07);
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .steps { display: flex; gap: 7px; padding: 12px 20px 0; overflow-x: auto; }
    .step {
      flex: 1 0 auto;
      min-width: 86px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: #71859f;
      background: #0b1828;
      cursor: pointer;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .step.active { border-color: var(--cyan); color: var(--cyan); background: rgba(56, 213, 239, .08); }
    .step.done { color: #b5c5d8; border-color: #3c5472; }

    #canvas { padding: 18px 20px; }
    .workspace { display: grid; grid-template-columns: .9fr 1.1fr; gap: 14px; min-height: 440px; }
    .card { border: 1px solid var(--line); border-radius: 14px; background: rgba(8, 20, 34, .66); }
    .card-title { display: flex; align-items: center; justify-content: space-between; min-height: 45px; padding: 0 14px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 900; }
    .card-title span { color: var(--muted); font-size: 10px; font-weight: 600; }
    .card-body { padding: 13px; }

    .flow-list { display: grid; gap: 9px; }
    .flow {
      display: grid;
      grid-template-columns: 30px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #112238;
      transition: .22s ease;
    }
    .flow-id { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 8px; color: #07131c; background: var(--cyan); font-size: 11px; font-weight: 900; }
    .route { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 900; }
    .experts { display: flex; flex-wrap: wrap; gap: 4px; }
    .expert { padding: 3px 6px; border-radius: 5px; color: #d9ccff; background: rgba(170, 140, 255, .16); font: 9px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .count { color: var(--muted); font-size: 9px; text-transform: uppercase; }
    .flow.current { border-color: var(--cyan); transform: translateX(3px); background: rgba(56, 213, 239, .08); }
    .flow.done { opacity: .43; }

    .batch-board { display: grid; gap: 12px; }
    .batch {
      min-height: 145px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0d1b2e;
      transition: .22s ease;
    }
    .batch.conflict { border-color: var(--red); background: rgba(255, 113, 133, .07); }
    .batch.fit { border-color: var(--green); background: rgba(101, 230, 163, .06); }
    .batch-head { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 11px; font-weight: 900; }
    .batch-head span:last-child { color: var(--muted); font-weight: 600; }
    .batch-flows { display: grid; gap: 7px; }
    .batch-flow { display: grid; grid-template-columns: auto 1fr; gap: 9px; align-items: center; padding: 8px 9px; border-radius: 9px; background: #182c46; }
    .batch-flow.new { color: #07131c; background: var(--green); animation: pop .25s ease; }
    .batch-flow strong { font-size: 11px; }
    .batch-flow .expert { color: inherit; background: rgba(255, 255, 255, .10); }
    .empty { color: #61758f; font-size: 11px; }
    @keyframes pop { 50% { transform: scale(1.035); } }

    .message {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--muted);
      background: #0b1829;
      font-size: 12px;
    }
    .message strong { color: var(--text); }
    .status { flex: 0 0 auto; color: var(--cyan); font-size: 10px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .status.red { color: var(--red); }
    .status.green { color: var(--green); }

    .idea-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .idea { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); background: #0d1b2d; font-size: 10px; }
    .idea b { color: var(--text); }

    .controls {
      display: grid;
      grid-template-columns: auto auto auto auto 1fr;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-top: 1px solid var(--line);
      background: #0a1727;
    }
    .btn { min-height: 38px; padding: 0 15px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: var(--panel-2); cursor: pointer; }
    .btn:hover:not(:disabled) { border-color: #486786; transform: translateY(-1px); }
    .btn:disabled { opacity: .32; cursor: default; }
    .btn.primary { border-color: #258fa6; background: #0c5062; }
    .btn.playing { border-color: #a97937; background: #513814; }
    .counter { color: var(--muted); font-size: 11px; text-align: right; }

    @media (max-width: 720px) {
      .page { width: min(100% - 16px, 1120px); padding: 16px 0; }
      header, .stage-head { align-items: flex-start; flex-direction: column; }
      .summary, .rule { width: 100%; }
      .steps { flex-wrap: wrap; padding-inline: 12px; }
      .step { flex: 1 0 calc(33.333% - 7px); }
      #canvas { padding-inline: 12px; }
      .workspace { grid-template-columns: 1fr; min-height: 0; }
      .batch { min-height: 110px; }
      .controls { grid-template-columns: repeat(4, auto) 1fr; padding-inline: 12px; }
      .idea-strip { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">Interactive explainer</p>
        <h1>Migration Batching</h1>
        <p class="subtitle">Group experts by rank pair, then separate rank conflicts.</p>
      </div>
      <div class="summary">7 experts → 4 flows → 2 batches</div>
    </header>

    <section class="stage">
      <div class="stage-head">
        <div>
          <h2>Greedy batching</h2>
          <p>Expert count belongs to the flow. Endpoints decide the batch.</p>
        </div>
        <div class="rule">endpoints(flow) ∩ used(batch) = ∅</div>
      </div>
      <div class="steps" id="steps"></div>
      <div id="canvas" aria-live="polite"></div>
      <div class="controls">
        <button class="btn" id="reset" type="button">Reset</button>
        <button class="btn" id="prev" type="button">Prev</button>
        <button class="btn primary" id="next" type="button">Next</button>
        <button class="btn" id="play" type="button">Play</button>
        <span class="counter" id="counter"></span>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const flows = [
      { id: "A", src: 0, dst: 2, experts: ["E1", "E7"] },
      { id: "B", src: 1, dst: 3, experts: ["E4"] },
      { id: "C", src: 0, dst: 3, experts: ["E2", "E5", "E9"] },
      { id: "D", src: 2, dst: 1, experts: ["E6"] }
    ];

    const steps = [
      { label: "Input", current: null, batches: [], text: "Four rank-pair flows carry seven experts.", status: "Start" },
      { label: "Flow A", current: "A", batches: [["A"]], text: "A carries E1 and E7 together. Create Batch 0.", status: "New Batch 0" },
      { label: "Flow B", current: "B", batches: [["A", "B"]], text: "R1 and R3 are free in Batch 0. E4 can run with Flow A.", status: "Place in B0", fit: 0 },
      { label: "Flow C", current: "C", batches: [["A", "B"], ["C"]], text: "C carries three experts, but only R0 and R3 determine the conflict.", status: "Conflict → B1", conflict: 0 },
      { label: "Flow D", current: "D", batches: [["A", "B"], ["C", "D"]], text: "Batch 0 conflicts. R2 and R1 are free in Batch 1.", status: "Place in B1", conflict: 0, fit: 1 },
      { label: "Done", current: null, batches: [["A", "B"], ["C", "D"]], text: "All experts in one flow move together; no rank repeats inside a batch.", status: "2 batches" }
    ];

    const state = { step: 0, timer: null };
    const el = {
      steps: document.querySelector("#steps"),
      canvas: document.querySelector("#canvas"),
      reset: document.querySelector("#reset"),
      prev: document.querySelector("#prev"),
      next: document.querySelector("#next"),
      play: document.querySelector("#play"),
      counter: document.querySelector("#counter")
    };

    function flow(id) { return flows.find(item => item.id === id); }
    function expertChips(item) { return item.experts.map(expert => `<span class="expert">${expert}</span>`).join(""); }

    function renderFlows(step) {
      const placed = new Set(step.batches.flat());
      return flows.map(item => `
        <div class="flow ${step.current === item.id ? "current" : ""} ${placed.has(item.id) && step.current !== item.id ? "done" : ""}">
          <span class="flow-id">${item.id}</span>
          <span><span class="route">R${item.src} → R${item.dst}</span><span class="experts">${expertChips(item)}</span></span>
          <span class="count">${item.experts.length} expert${item.experts.length > 1 ? "s" : ""}</span>
        </div>`).join("");
    }

    function renderBatches(step) {
      return [0, 1].map(index => {
        const ids = step.batches[index] || [];
        const ranks = [...new Set(ids.flatMap(id => { const item = flow(id); return [item.src, item.dst]; }))];
        const classes = ["batch", step.conflict === index ? "conflict" : "", step.fit === index ? "fit" : ""].join(" ");
        return `<div class="${classes}">
          <div class="batch-head"><span>Batch ${index}</span><span>${ranks.length ? `used: ${ranks.map(rank => `R${rank}`).join(" ")}` : "empty"}</span></div>
          <div class="batch-flows">${ids.length ? ids.map(id => {
            const item = flow(id);
            return `<div class="batch-flow ${step.current === id ? "new" : ""}"><strong>${id}: R${item.src} → R${item.dst}</strong><span class="experts">${expertChips(item)}</span></div>`;
          }).join("") : '<span class="empty">No flow yet</span>'}</div>
        </div>`;
      }).join("");
    }

    function render() {
      const step = steps[state.step];
      el.steps.innerHTML = steps.map((item, index) => `<button class="step ${index === state.step ? "active" : index < state.step ? "done" : ""}" data-step="${index}" type="button">${index + 1}. ${item.label}</button>`).join("");
      el.steps.querySelectorAll(".step").forEach(button => button.addEventListener("click", () => { stop(); setStep(Number(button.dataset.step)); }));
      const statusClass = step.status.includes("Conflict") ? "red" : step.status.includes("Place") ? "green" : "";
      el.canvas.innerHTML = `
        <div class="workspace">
          <section class="card"><div class="card-title">Flows <span>experts grouped by rank pair</span></div><div class="card-body flow-list">${renderFlows(step)}</div></section>
          <section class="card"><div class="card-title">Batches <span>no repeated rank</span></div><div class="card-body batch-board">${renderBatches(step)}</div></section>
        </div>
        <div class="message"><span><strong>${step.label}.</strong> ${step.text}</span><span class="status ${statusClass}">${step.status}</span></div>
        <div class="idea-strip">
          <div class="idea"><b>Flow:</b> all experts with the same source and destination.</div>
          <div class="idea"><b>Batch:</b> flows whose rank endpoints do not overlap.</div>
        </div>`;
      el.prev.disabled = state.step === 0;
      el.next.disabled = state.step === steps.length - 1;
      el.counter.textContent = `${state.step + 1} / ${steps.length}`;
    }

    function setStep(next) {
      state.step = Math.max(0, Math.min(steps.length - 1, next));
      render();
    }

    function stop() {
      if (state.timer) clearInterval(state.timer);
      state.timer = null;
      el.play.textContent = "Play";
      el.play.classList.remove("playing");
    }

    function togglePlay() {
      if (state.timer) { stop(); return; }
      if (state.step === steps.length - 1) setStep(0);
      state.timer = setInterval(() => {
        if (state.step === steps.length - 1) stop(); else setStep(state.step + 1);
      }, 1500);
      el.play.textContent = "Pause";
      el.play.classList.add("playing");
    }

    el.reset.addEventListener("click", () => { stop(); setStep(0); });
    el.prev.addEventListener("click", () => { stop(); setStep(state.step - 1); });
    el.next.addEventListener("click", () => { stop(); setStep(state.step + 1); });
    el.play.addEventListener("click", togglePlay);
    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") { stop(); setStep(state.step - 1); }
      if (event.key === "ArrowRight") { stop(); setStep(state.step + 1); }
      if (event.code === "Space" && event.target.tagName !== "BUTTON") { event.preventDefault(); togglePlay(); }
    });

    const queryStep = Number(new URLSearchParams(window.location.search).get("step"));
    if (Number.isInteger(queryStep)) state.step = Math.max(0, Math.min(steps.length - 1, queryStep));
    render();
  </script>
</body>
</html>
